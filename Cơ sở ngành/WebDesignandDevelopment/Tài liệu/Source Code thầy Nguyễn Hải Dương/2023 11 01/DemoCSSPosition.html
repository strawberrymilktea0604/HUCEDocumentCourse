<html>
<head>
    <style>
        #div1, #div2
        {
            width: 200px;
            height: 100px;
        }

        #div1
        {
            background: green;
            position: absolute;
            /*z-index: 100;*/
        }
        #div2
        {
            background: red;
            position: absolute;
            top:20px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div style="position: relative">
        <div id="div1"></div>
        <div id="div2"></div>
    </div>
</body>
</html>

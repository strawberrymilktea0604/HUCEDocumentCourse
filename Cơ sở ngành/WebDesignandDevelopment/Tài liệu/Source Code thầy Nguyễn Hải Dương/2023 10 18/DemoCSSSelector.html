<html>
    <head>
        <style>
            /*Loại 2: Id Selector */
            #p4
            {
                color: green ;
            }

            /* Loại 3: Class selector */
            .class-name
            {
                color: blue;
            }

            /* Loại 1: Element selector */
            p
            {
                color: red !important;
            }
            
        </style>
    </head>
    <body>
        <p>Đây là thẻ p thứ 1</p>
        <p>Đây là thẻ p thứ 2</p>
        <p>Đây là thẻ p thứ 3</p>
        <p id="p4" class="class-name">Đây là thẻ p thứ 4</p>
        <p id="p5">Đây là thẻ p thứ 5</p>
        <p class="class-name" id="p6">Đây là thẻ p thứ 6</p>

    </body>
</html>

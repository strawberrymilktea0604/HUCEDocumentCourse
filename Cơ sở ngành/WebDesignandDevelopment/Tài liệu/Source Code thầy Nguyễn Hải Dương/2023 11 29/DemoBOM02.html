<html>
<head>
    <style>
        .C_div1_wide {
            width: 70%;
            height: 200px;
            background: green;
            float: left;
        }

        .C_div2_wide {
            width: 30%;
            height: 200px;
            background: red;
            float: left;
        }

        .C_div1_mobile {
            width: 100%;
            height: 100px;
            background: green;            
        }

        .C_div2_mobile {
            width: 100%;
            height: 300px;
            background: red;
        }
    </style>
    <script>
        function body_resize() {
            //lấy về kích thước cửa sổ hiện tại
            var w = window.innerWidth;
            var h = window.innerHeight;

            var div1 = document.getElementById("div1");
            var div2 = document.getElementById("div2");

            //điều khiển đối tượng bằng JS
            //if (w < 600) {
            //    //alert("abc");
            //    div1.style.clear = "both";
            //    div2.style.clear = "both";
            //    div1.style.width = "100%";
            //    div2.style.width = "100%";
            //}
            //else {
            //    div1.style.float = "left";
            //    div2.style.float = "left";
            //    div1.style.width = "70%";
            //    div2.style.width = "30%";
            //    div1.style.clear = "";
            //    div2.style.clear = "";
            //}

            //Điều khiển đối tượng bằng css
            if (w < 600) {
                //alert("abc");
                div1.className = "C_div1_mobile";
                div2.className = "C_div2_mobile";
            }
            else {
                div1.className = "C_div1_wide";
                div2.className = "C_div2_wide";
            }
        }
    </script>
</head>
<body onresize="body_resize()">
    <div id="div1" class="C_div1_wide"></div>
    <div id="div2" class="C_div2_wide"></div>
</body>
</html>

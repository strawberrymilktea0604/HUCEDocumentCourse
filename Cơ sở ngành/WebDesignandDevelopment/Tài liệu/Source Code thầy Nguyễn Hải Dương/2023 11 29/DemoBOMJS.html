<html>
<head>
    <script>
        function get_window_size() {
            var p1 = document.getElementById("p1");
            p1.innerHTML = "Window size: " + window.innerWidth + "x" + window.innerHeight + "<br>" + "Screen size: " + screen.width + "x" + screen.height;

            if (window.innerWidth < 400) {
                p1.style.color = "red";
            }
            else {
                p1.style.color = "green";
            }
        }
    </script>
</head>
<body onresize="get_window_size()">
    <p id="p1"></p>    
</body>
</html>

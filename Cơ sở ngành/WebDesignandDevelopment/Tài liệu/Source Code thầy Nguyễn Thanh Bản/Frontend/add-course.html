<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Khóa Học Mới</title>
    <link rel="stylesheet" href="style.css"> <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; } /* box-sizing để padding không làm vỡ layout */
        textarea { height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-back { background-color: #6c757d; margin-top: 10px; }
        .btn-back:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Thêm Khóa Học</h2>
        <form id="addCourseForm">
            <div class="form-group">
                <label for="name">Tên khóa học (*)</label>
                <input type="text" id="name" placeholder="Ví dụ: ReactJS Nâng cao" required>
            </div>

            <div class="form-group">
                <label for="price">Học phí (VNĐ) (*)</label>
                <input type="number" id="price" placeholder="Nhập số tiền..." required>
            </div>

            <div class="form-group">
                <label for="description">Mô tả chi tiết</label>
                <textarea id="description" placeholder="Nội dung khóa học..."></textarea>
            </div>

            <button type="submit" id="btnSave">Lưu khóa học</button>
            <button type="button" class="btn-back" onclick="window.location.href='home.html'">Quay lại</button>
        </form>
    </div>

    <script src="add-course.js"></script>
</body>
</html>

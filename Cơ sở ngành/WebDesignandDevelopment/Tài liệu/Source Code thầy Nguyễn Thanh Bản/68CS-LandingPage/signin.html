<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="node_modules/jquery/dist/jquery.min.js"></script>
    <title>Signin</title>
    <style>
        .success {
            border-color: rgb(12, 232, 12);
        }

        .error {
            border-color: red;
        }

        .normal {
            border-width: 0.4px;
            border-radius: 4px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            height: 30px;
        }

        input:focus {
            border: 0.4px solid red;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 0.4px solid #ccc;
            -webkit-transition: 0.5s;
            transition: 0.5s;
            outline: none;
        }

        span {
            color: red;
        }

        .container {
            border: 1px solid gray;
            border-radius: 8px;
            padding: 10px 100px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <center>
        <div class="container">
            <h1>Sign in</h1>
            <form name="formsignin" method="post">
                <label for="txtEmail">Email</label>
                <br>
                <input type="email" name="txtEmail" class="normal" id="txtEmail">
                <br>
                <br>
                <label for="txtPassword">Password</label>
                <br>
                <input type="password" name="txtPassword" class="normal" id="txtPassword">
                <br>
                <span id="errMessage"></span>
                <br>
                <button onclick="validateFormData()" type="button">Sign in</button>
            </form>
        </div>
    </center>
    <script src="js/signin.js"></script>
</body>

</html>

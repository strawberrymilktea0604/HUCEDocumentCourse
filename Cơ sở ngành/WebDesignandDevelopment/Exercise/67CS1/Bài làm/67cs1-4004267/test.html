<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Mai Thanh Toan</title>
  </head>
  <body>
    <h1>Subscription Form</h1>
    <form
      method="GET"
      action=""
      name="f"
      onSubmit="return check(event)"
      enctype="multipart/form-data"
    >
      <fieldset>
        <legend>Personal information</legend>
        First Name:
        <input type="text" name="fname" id="fname" placeholder="Ho" />
        Last Name:
        <input type="text" name="lname" id="lname" placeholder="Ten" />

        <br />
        <input type="radio" name="gender" id="male" value="male" />
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female" />
        <label for="female">Female</label>

        <br />
        <label for="address">Address:</label>
        <br />
        <textarea
          name="address"
          id="address"
          cols="30"
          rows="10"
          placeholder=""
          value="address"
        ></textarea>
      </fieldset>

      <br />
      <fieldset>
        Magazines subscription for
        <br />
        <input type="checkbox" name="magazine" id="TIME" value="TIME" />
        <label for="TIME">TIME</label>
        <input type="checkbox" name="magazine" id="Newsweek" value="Newsweek" />
        <label for="Newsweek">Newsweek</label>
        <input type="checkbox" name="magazine" id="Sunday" value="Sunday" />
        <label for="Sunday">Sunday</label>
        <input type="checkbox" name="magazine" id="Vogue" value="Vogue" />
        <label for="Vogue">Vogue</label>
        <input type="checkbox" name="magazine" id="People" value="People" />
        <label for="People">People</label>
      </fieldset>

      <br />
      <fieldset>
        <legend>Duration</legend>
        <input type="radio" name="duration" id="1year" value="1 year" />
        <label for="1year">1 year</label>
        <input type="radio" name="duration" id="3years" value="3 years" />
        <label for="3years">3 years</label>
        <input type="radio" name="duration" id="5years" value="5 years" />
        <label for="5years">5 years</label>
      </fieldset>

      <br />
      <fieldset>
        <legend>Payment options</legend>
        <input
          type="radio"
          name="payment"
          id="DemandDraft"
          value="Demand Draft"
        />
        <label for="DemandDraft">Demand Draft</label>
        <input
          type="radio"
          name="payment"
          id="CreditCard"
          value="Credit Card"
        />
        <label for="CreditCard">Credit Card</label>
      </fieldset>

      <br />
      <button>Process</button>
      <button type="reset">Reset</button>
    </form>

    <script src="main.js"></script>
  </body>
</html>
<script>
    function check(event) {
        var count = 0;
        for (i = 0; i < f.magazine.length; i++) {
          if (f.magazine[i].checked == true) count++;
        }
        if (f.fname.value == "") {
          alert("The first name field cannot be empty!");
          return false;
        } else if (f.lname.value == "") {
          alert("The last name field cannot be empty!");
          return false;
        } else if (f.address.value == "") {
          alert("The address field cannot be empty!");
          return false;
        } else if (
          count < 1 ||
          f.duration.value == "" ||
          f.payment.value == ""
        ) {
          alert(
            "User must choose at least a magazine, duration, and payment option!"
          );
          return false;
        } else {
          var firstName = document.getElementById("fname").value;
          var lastName = document.getElementById("lname").value;
          var address = document.getElementById("address").value;
          var magazines = document.querySelectorAll(
            'input[name="magazine"]:checked'
          );
          var duration = document.querySelector(
            'input[name="duration"]:checked'
          );
          var payment = document.querySelector('input[name="payment"]:checked');
          var gender = document.querySelector('input[name="gender"]:checked');
          var confirmmsg = "Do you want to order ";
    
          magazines.forEach(function (magazine) {
            confirmmsg += magazine.value + " ";
          });
          confirmmsg +=
            "magazine(s) for " +
            duration.value +
            " and to pay with " +
            payment.value +
            "?";
          if (confirm(confirmmsg)) {
            var finalmsg =
              "Thank you very much for your order, we will supply as soon as possible the magazines for you to the address:\n\t" +
              (gender && gender.value === "male" ? "Mr. " : "Mrs. ") +
              fname.value +
              " " +
              lname.value +
              "\n\t" +
              address;
    
            alert(finalmsg);
          } else {
            event.preventDefault();
            document.getElementById("lname").focus();
          }
        }
      }
</script>

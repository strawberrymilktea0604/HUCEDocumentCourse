<html>
    <head>
    </head>
    <body>
        <script type="text/javascript">
            function validateEmail(email) {
                const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            }

            function validatePassword(password){
                const re = /^(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{6,16}$/;
                return re.test(String(password));
            }

            function checkRegEx(){
                with(document){
                    if(mainform.txtEmail.value==""){
                        alert("Vui lòng nhập Email"); 
                        return false;
                    }
                    if(mainform.txtPassword.value==""){
                        alert("Vui lòng nhập Password");
                        return false;
                    }
                    if(validateEmail(mainform.txtEmail.value)==false){
                        alert("Email không hợp lệ, vui lòng nhập lại!!");
                        return false;
                    }
                    if(validatePassword(mainform.txtPassword.value)==false){
                        alert("Mật khẩu không hợp lệ!!");
                        return false;
                    }
                }
            }
        </script>

        <form name="mainform" action="question2.html" method="POST">
            <table id="mainTable" border="1">
                <tr id="TableTitle">
                    <td align="center" colspan="2">Admistator</td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td><input type="text" name="txtEmail">
                        <div style="white-space: pre">(example: admin@aptech.vn)</div>
                    </td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="txtPassword">
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="reset" name="btnReset">
                        <input type="submit" name="btnSubmit" onclick="return checkRegEx();">
                    </td>
                </tr>
            </table>
        </form>
        
    </body>
</html>

</div>
      

<script>
    var addbutton=document.getElementById('add');
    addbutton.onmousemove=()=>{
        addbutton.style.backgroundColor = "red"
    }
    addbutton.onmouseout=()=>{
        addbutton.style.backgroundColor = "#EFEFEF"
    }

 function foucusfuntion(id){
    document.getElementById(id).style.background = "black";
    document.getElementById(id).style.color = "white";

  }
function blurfuntion(id)
{
    document.getElementById(id).style.background = "white";
}
function showandhiden(){
    var check=document.getElementById('status')
    console.log(check.checked)
    check.onclick=function(e){
    if(this.checked){
        getElementById('show').innerText('show')

    }else{
        getElementById('show').innerText('hiden')

    }
}
}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="0px"> 
        <tr bgcolor="black">
            <td colspan="2" align="center" style="color: white;" >ADDNEW PRODUCTION</td>
        </tr>
        <tr>
            <td align="right">
                Category Choose:
            </td>
            <td align="left">
                <select name="" id="">
                    <option value="">[Select]</option>
                    <option value="">Nokia</option>
                    <option value="">Samsung</option>
                    <option value="">LG</option>
                    <option value="">Sony</option>
                </select><br>
            </td>
        </tr>
        <tr>
            <td align="right">Product Name:</td>
            <td align="left"><input class="input" type="text" style="width: 200px;"></td>
        </tr>
        <tr>
            <td align="right">Product Description:</td>
            <td align="left"><input class="input" type="text" style="width: 250px; height: 50px;"></td>
        </tr>
        <tr>
            <th align="right">Product Quantity:</th>
            <th align="left"><input class="input" type="text" style="width: 100px;">(positive)</th>
        </tr>
        <tr>
            <th align="right">Product Price:</th>
            <th align="left"><input class="input" type="text" style="width: 100px;">($)</th>
        </tr>
        <tr>
            <th align="right">Product Image:</th>
            <th align="left"> <input class="input"  type="text" style="width: 200px";><button type="button">Browser</button></th>
        </tr>
        <tr>
            <th align="right">Product Info:</th>
            <th align="left"><input class="input" type="text" style="width: 250px; height: 70px;"></th>
        </tr>
        <tr>
            <th align="right">Product Status:</th>
            <th align="left"><input class="input" type="checkbox">Show</th>
        </tr>
        <tr>
            <th></th>
            <th align="left">
                <button>Addnew</button>
                <input type="reset" name="Reset" value="Reset">
            </th>
        </tr>
    </table>
</body>
</html>

    function checkRegEx(){
        with(document){
            //Username and All Password
            const reUsername, rePassword;
            reUsername = /\d{6,12}/;
            rePassword = /\d{6,12}/;
            if(reUsername.test(lab8.txtUserName.value) == false)
            {
                alert("Username quá dài, vui lòng nhập lại!");
                return false;
            }
            if(rePassword.test(lab8.txtPasswordLv1.value) == false || rePassword.test(lab8.txtPasswordLv2.value) == false){
                alert("Mật khẩu quá dài, vui lòng nhập lại!");
                return false;
            }
            if(validateEmail(f1.txtEmail.value) == false){
                alert("Email không hợp lệ, vui lòng nhập lại");
                return false;
            }
        }
        
    }

    function checkPasswordisEqual(){
        with(document){
            if(lab8.txtPasswordLv1.value == lab8.txtPasswordLv2.value){
                alert("Mật khẩu 1 và 2 không được giống nhau");
                return false;
            }
        }
    }

    function validateEmail(email) {
        const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        return re.test(String(email).toLowerCase());
    }

</script>

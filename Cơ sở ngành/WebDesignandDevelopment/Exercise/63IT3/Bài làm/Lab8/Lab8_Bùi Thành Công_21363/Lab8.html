<html>
    <head>
        <tilte>Lab 8</tilte>
        <style>
            fieldset{
                border-style: solid;
                border-width: 2px;
                z-index: 2;
            }
            legend{
                color: blue;
            }
            .cls1{
                size:20;
            }
            .cls2{
                text-align: right;
            }
        </style>
        <script>
            function doimau(id,color){
                id.style.backgroundColor=color;
            }
            function kiemtra()
            {
                with(document){
                    if(c1.name.value==""){
                        alert("Bạn chưa nhập tên!");
                        c1.name.focus();
                        return false;
                    }
                    if(c1.pwd1.value==""){
                        alert("Bạn chưa nhập mật khẩu cấp 1!");
                        c1.pwd1.focus();
                        return false;
                    }
                    if (c1.pwd1.value.length<6 && c1.pwd1.value.length>12 ){
                        alert("Mật Khẩu phải từ 6 đến 12 ký tự!");
                        return false;
                    }
                    if(c1.pwd3.value==""){
                        alert("Bạn chưa nhập lại mật khẩu cấp 1!");
                        c1.pwd3.focus();
                        return false;
                    }
                    if(c1.pwd3.value!= c1.pwd1.value){
                        alert("Bạn nhập sai mật khẩu cấp 1!")
                        c1.pwd3.focus();
                        return false;
                    }
                    if(c1.pwd2.value==""){
                        alert("Bạn chưa nhập mật khẩu cấp 2!");
                        c1.pwd2.focus();
                        return false;
                    }
                    if (c1.pwd2.value.length<6 && c1.pwd2.value.length>12 ){
                        alert("Mật Khẩu phải từ 6 đến 12 ký tự!");
                        return false;
                    }
                    if(c1.pwd2.value== c1.pwd1.value){
                        alert("Mật khẩu cấp 2 bị trùng mật khẩu cấp 1!")
                        c1.pwd2.focus();
                        return false;
                    }
                    if(c1.pwd4.value==""){
                        alert("Bạn chưa nhập lại mật khẩu cấp 2!");
                        c1.pwd4.focus();
                        return false;
                    }
                    if(c1.pwd4.value!= c1.pwd2.value){
                        alert("Bạn nhập sai mật khẩu cấp 2!");
                        c1.pwd4.focus();
                        return false;
                    }
                    
                    if(c1.ques.value=="Choose a question…"){
                        alert("Bạn chưa chọn câu hỏi!")
                        return false;
                    }
                    if(c1.ans.value==""){
                        alert("Bạn chưa nhập câu trả lời!");
                        c1.ans.focus();
                        return false;
                    }
                    if(c1.fn.value==""){
                        alert("Bạn chưa nhập họ và tên!");
                        c1.fn.focus();
                        return false;
                    }
                    t = 0;
                    for(i=0;i<c1.sex.length;i++){
                        if (c1.sex[i].checked==true) t++;
                    }
                    if (t==0){
                        alert("Bạn phải chọn 1 giới tính!");
                        return false;
                    }
                    if(c1.email.value==""){
                        alert("Bạn chưa nhập email!");
                        c1.email.focus();
                        return false;
                    }
                    //if(c1.sn.value<1/1/1940 || c1.sn.value>31/12/2000)
                    //alert("Bạn phải nhập năm sinh từ 1940 đến 2000!");
                    //return false;
                }
            }
        </script>
    </head>
    <body>
        <fieldset>
            <legend>Information for play game</legend>
            <form name=c1 action="Lab8.html" method="POST">
                <table border=0 cellspacing=5 cellpadding=5 width=600 align=center>
                    <tr>
                        <td class=cls2>Name*:</td>
                        <td><input class=cls1 type="text" name=name onFocus="doimau(this,'yellow');"  onBlur="doimau(this,'white');"></td>
                    </tr>
                    <tr>
                        <td class=cls2>Password level 1*:</td>
                        <td><input class=cls1 type="password" name=pwd1 onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                    </tr>
                    <tr>
                        <td class=cls2>Re-enter password level 1*:</td>
                        <td><input class=cls1 type="password" name=pwd3 onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                    </tr>
                    <tr>
                        <td class=cls2>Password level 2*:</td>
                        <td><input class=cls1 type="password" name=pwd2 onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                    </tr>
                    <tr>
                        <td class=cls2>Re-enter password level 2*:</td>
                        <td><input class=cls1 type="password" name=pwd4 onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                    </tr>
                    <tr>
                        <td class=cls2>Security Question*:</td>
                        <td>
                        <select name=ques >
                            <option value="Choose a question…">Choose a question…</option>
                            <option value="What is your library card number?">What is your library card number?</option>
                            <option value="What was your first phone number?">What was your first phone number?</option>
                            <option value="What was your first teacher name?">What was your first teacher name?</option>
                        </select></td>
                    </tr>
                    <tr>
                        <td class=cls2>Answer*:</td>
                        <td><input class=cls1 type="text" name=ans onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                    </tr>

                </table>

            
          </fieldset>
          <fieldset>
              <legend>Customer Information</legend>
                  <table border="0" cellspacing=5 cellpadding=5 width=600 align=center>
                      <tr>
                          <td class=cls2>Full name*:</td>
                          <td><input class=cls1 type="text" name=fn onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                          <td>
                          <input style="margin-left: 0;" type="radio" name=sex>
                          <label for="sex">Male</label>
                          <input style="margin-left: 0;" type="radio" name=sex>
                          <label for="sex">Female</label>
                          </td>
                      </tr>
                      <tr>
                          <td class=cls2>Email*:</td>
                          <td><input class=cls1 type="email" name=email onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                        </tr>
                        <tr>
                            <td class="cls2">Birthday:</td>
                            <td><input type="date" name=sn></td>
                        <tr>
                            <td class="cls2">Address:</td>
                            <td><input class=cls1 type="text" name=add onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                        </tr>
                        <tr>
                            <td class="cls2">Homephone:</td>
                            <td><input class=cls1 type="number" name=hph onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                            <td class="cls2">Mobile:
                            <input class=cls1 type="number" name=mph onFocus="doimau(this,'yellow');" onBlur="doimau(this,'white');"></td>
                        </tr>
                  </table>

          </fieldset>
          <table border="0" cellspacing=5 cellpadding=5 width=600 align=center>
              <tr>
                  <td align="center"><input type="submit" onClick="return kiemtra();" name=register value="Register">
                  <input type="reset" value="Reset"></td>
              </tr>
          </table>
        </form>
    </body>
</html>

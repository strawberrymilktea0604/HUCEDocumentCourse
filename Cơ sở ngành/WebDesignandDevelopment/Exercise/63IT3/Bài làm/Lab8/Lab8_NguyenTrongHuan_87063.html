<html>

    <body>
        <script type="text/javascript">
            function checkFill(){
                with(document){
                    if(f1.txtUserName.value == ""){
                        alert("Vui long nhap Username");
                        return false;
                    }
                    if(f1.txtPasswordLv1.value == ""){
                        alert("Vui long nhap Password level 1");
                        return false;
                    }
                    if(f1.txtReEnterPasswordLv1.value == ""){
                        alert("Vui long nhap lai Password level 1");
                        return false;
                    }
                    if(f1.txtPasswordLv1.value == ""){
                        alert("Vui long nhap Password level 2");
                        return false;
                    }
                    if(f1.txtReEnterPasswordLv2.value == ""){
                        alert("Vui long nhap lai Password level 2");
                        return false;
                    }
                    if(f1.slcSecurityQuestion.value == ""){
                        alert("Vui long Chon cau hoi");
                        return false;
                    }
                    if(f1.txtSecQuestionAnswer.value == ""){
                        alert("Vui long nhap Answer");
                        return false;
                    }
                    if(f1.txtFullName.value == ""){
                        alert("Vui long nhap Fullname");
                        return false;
                    }
                    if(f1.txtEmail.value == ""){
                        alert("Vui long nhap Email");
                        return false;
                    }
                    
                }
            }

            function checkRegEx(){
                with(document){
                    //Username and All Password
                    const reUsername, rePassword;
                    reUsername = /\d{6,12}/;
                    rePassword = /\d{6,12}/;
                    if(reUsername.test(f1.txtUserName.value) == false)
                    {
                        alert("Username quá dài, vui lòng nhập lại!");
                        return false;
                    }
                    if(rePassword.test(f1.txtPasswordLv1.value) == false || rePassword.test(f1.txtPasswordLv2.value) == false){
                        alert("Mật khẩu quá dài, vui lòng nhập lại!");
                        return false;
                    }
                    if(validateEmail(f1.txtEmail.value) == false){
                        alert("Email không hợp lệ, vui lòng nhập lại");
                        return false;
                    }
                }
                
            }

            function checkPasswordisEqual(){
                with(document){
                    if(f1.txtPasswordLv1.value == f1.txtPasswordLv2.value){
                        alert("Mật khẩu 1 và 2 không được giống nhau");
                        return false;
                    }
                }
            }

            function validateEmail(email) {
                const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
                return re.test(String(email).toLowerCase());
            }

        </script>

        <form name="f1" action="/action_page.php">
            <fieldset>
                <legend>Information for play game</legend>
                <table align="center">
                    <tr>
                      <td align="right">Username*</td>
                      <td align="left"><input type="text" name="txtUserName" /></td>
                    </tr>
                    <tr>
                      <td align="right">Password Level 1*</td>
                      <td align="left"><input type="text" name="txtPasswordLv1" /></td>
                    </tr>
                    <tr>
                      <td align="right">Re-enter Password Level 1*</td>
                      <td align="left"><input type="text" name="txtReEnterPasswordLv1" /></td>
                    </tr>
                    <tr>
                        <td align="right">Password Level 2*</td>
                        <td align="left"><input type="text" name="txtPasswordLv2" /></td>
                      </tr>
                      <tr>
                        <td align="right">Re-enter Password Level 2*</td>
                        <td align="left"><input type="text" name="txtReEnterPasswordLv2" /></td>
                      </tr>
                      <tr>
                        <td align="right">Security Question</td>
                        <td align="left"><select name="slcSecurityQuestion" id="SecQuestion">
                            <option value="catName">What is my Cat name ?</option>
                            <option value="dogName">What is my Dog name ?</option>
                            <option value="pigName">What is my Pig name ?</option>
                        </select></td>
                      </tr>
                      <tr>
                        <td align="right">Answer*</td>
                        <td align="left"><input type="text" name="txtSecQuestionAnswer" /></td>
                      </tr>
                  </table>
            </fieldset>
            <fieldset>
                <legend>Customer Information</legend>
                <table align="center">
                    <tr>
                        <td align="right">Fullname*</td>
                        <td align="left"><input type="text" name="txtFullName" /></td>
                        <td>
                            <input type="radio" name="rdGender">Male
                            <input type="radio" name="rdGender">Female
                        </td>
                    </tr>
                    <tr>
                        <td align="right">Email*</td>
                        <td align="left"><input type="text" name="txtEmail" /></td>
                    </tr>
                    <tr>
                        <td align="right">Birthday</td>
                        <td align="left"><input type="datetime-local" name="inputDate" /></td>
                    </tr>
                    <tr>
                        <td align="right">Address</td>
                        <td align="left"><input type="text" name="txtAddress" /></td>
                    </tr>
                    <tr>
                        <td align="right">Homephone</td>
                        <td align="left"><input type="text" name="txtHomephone" /></td>
                        <td align="right">Mobile</td>
                        <td align="left"><input type="text" name="txtMobile" /></td>
                    </tr>
                </table>
            </fieldset>
            <div>
                <p>*<b>Note:</b> all of the field that have "*" must be inputted</p>
            </div>
            <div style="text-align:center">
                <input onclick="return (checkFill() && checkPasswordisEqual() && checkRegEx());" type="submit" name="btnSubmit">
                <input type="reset" name="btnReset">
            </div>
            
          </form>
    </body>
</html>

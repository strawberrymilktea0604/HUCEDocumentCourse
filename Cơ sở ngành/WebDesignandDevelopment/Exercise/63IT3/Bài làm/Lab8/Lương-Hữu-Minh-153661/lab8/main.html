<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        .row {
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
    </style>
</head>

<body>
    <div class="container"
        style="border: 1px solid rgb(218, 216, 216);padding: 5px;position: relative;margin-top: 50px;border-radius: 10px;">
        <div class="texxt"
            style="display: inline; background: white;position: absolute;top: -15px;left: 10px;color: blue; font-weight: bold;">
            <span>Information for play game</span>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>User name*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="userName" type="text"
                    name="" id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Password level1*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="pw1" type="text" name=""
                    id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Re-endter password level1*:</span>
            </div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="rePw1" type="text" name=""
                    id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Password level2*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="pw2" type="text" name=""
                    id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Re-endter password level2*:</span>
            </div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="rePw2" type="text" name=""
                    id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Security question*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><select id="chooseQ" name="">
                    <option value="0">Choose a question...</option>
                    <option value="1">What is your library card number</option>
                    <option value="2">What was your first phone number</option>
                    <option value="3">What was your first teacher name</option>
                </select></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Anwser*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="anwser" type="text" name=""
                    id=""></div>
        </div>
    </div>
    <div class="container"
        style="margin-top:20px;border: 1px solid rgb(218, 216, 216);padding: 5px;position: relative;border-radius: 10px;">
        <div class="texxt"
            style="display: inline; background: white;position: absolute;top: -15px;left: 10px;color: blue; font-weight: bold;">
            <span>Information for play game</span>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Fullname*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="fullName" type="text"
                    name="" id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Email*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;"><input id="email" type="text" name=""
                    id=""></div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Birthday*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;">
                <div><select id="selectDay" name="" style="margin-left:10px"></select></div>
                <div><select id="selectMonth" name="" style="margin-left:10px"></select></div>
                <div><select id="selectYear" name="" style="margin-left:10px"></select></div>
            </div>
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Address*:</span></div>
            <div class="col-6" style="display: flex;justify-content: flex-start;padding-right;: 0"><input id="addr"
                    type="text" name="" id="" style="width: 100%"></div>
        </div>
        <div class="row" style="margin-top: 10px;display: flex;justify-content: flex-end;">
            <div class="col-6" style="display: flex;justify-content: flex-end;"><span>Home phone*:</span></div>
            <div class="col-6">
                <div class="row">
                    <div style="display: flex;justify-content: flex-end;width: 100%;"><input id="homePhone"
                            style="margin-left: 10px;" type="text" name="" id=""><span
                            style="margin-left: 10px;">Phone*:</span><input id="cellPhone"
                            style="margin-left: 10px;width: 100%;" type="text" name="" id=""></div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row" style="margin-top: 10px;"><span><b>Note</b>all of fields that have "*" must be inputted</span>
        </div>
        <div style="display:flex;justify-content: space-around;margin-top: 10px;"><button class="btn btn-success"
                onclick="regiterr()">Regiter</button><button class="btn btn-success" onclick="clearr()">Clear</button>
        </div>

    </div>
    <script>
        $(function () {
            let tmpDay = "";
            for (let i = 1; i < 32; i++) {
                tmpDay += `<option value="${i}">${i}</option>`
            }
            $('#selectDay').html(tmpDay)
            let tmpMonth = "";
            for (let i = 1; i < 13; i++) {
                tmpMonth += `<option value="${i}">${i}</option>`
            }
            $('#selectMonth').html(tmpMonth)
            let tmpYear = "";
            for (let i = 1940; i < 2000; i++) {
                tmpYear += `<option value="${i}">${i}</option>`
            }
            $('#selectYear').html(tmpYear)

        })

        function clearr() {
            $('#userName').val('')
            $('#pw1').val('')
            $('#rePw1').val('')
            $('#pw2').val('')
            $('#rePw2').val('')
            $('#chooseQ').val('')
            $('#anwser').val('')
            $('#fullName').val('')
            $('#email').val('')
            $('#addr').val('')
            $('#homePhone').val('')
            $('#cellPhone').val('')

        }

        function regiterr() {
            if (checkPass()) {

            }
        }

        function checkPass() {
            let check = true;
            checkInput()
            if (checkInput()) {
                if (!$('#email').val().match('/^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/') && check) {
                    alert("Email sai định dạng.")
                    check = false;
                }
                if ($('#userName').val().length > 6 && $('#userName').val().length < 12 && check) {
                    alert('User name from 6 to 12 character')
                    check = false
                }
                if ($('#pw1').val().length > 6 && $('#pw1').val().length < 12 && check) {
                    alert('Pass1 name from 6 to 12 character')
                    check = false
                }
                if ($('#pw2').val().length > 6 && $('#pw2').val().length < 12 && check) {
                    alert('Pass2 name from 6 to 12 character')
                    check = false
                }
                if ($('#pw1').val() !== $('#rePw1').val() && check) {
                    alert('Pass 1 không trùng re-pass1')
                    check = false
                }
                if ($('#pw2').val() !== $('#rePw2').val() && check) {
                    alert('Pass 2 không trùng re-pass2')
                    check = false
                }
                if ($('#pw2').val() === $('#pw1').val() && check) {
                    alert('Pass 1 phải khác Pass 2')
                    check = false
                }

            }
            return check;
        }

        function checkInput() {
            let check = true;
            if ($('#userName').val().length == 0 && check) {
                alert("Bạn chưa nhập username")
                check = false;
            }
            if ($('#pw1').val().length == 0 && check) {
                alert("Bạn chưa nhập password1")
                check = false;
            }
            if ($('#rePw1').val().length == 0 && check) {
                alert("Bạn chưa nhập re-password1")
                check = false;
            }
            if ($('#pw2').val().length == 0 && check) {
                alert("Bạn chưa nhập password2")
                check = false;
            }
            if ($('#rePw2').val().length == 0 && check) {
                alert("Bạn chưa nhập re-password1")
                check = false;
            }

            if ($('#anwser').val().length == 0 && check) {
                alert("Bạn chưa nhập anwser")
                check = false;
            }
            if ($('#fullName').val().length == 0 && check) {
                alert("Bạn chưa nhập fullName")
                check = false;
            }
            if ($('#email').val().length == 0 && check) {
                alert("Bạn chưa nhập email")
                check = false;
            }
            if ($('#addr').val().length == 0 && check) {
                alert("Bạn chưa nhập addr")
                check = false;
            }
            if ($('#homePhone').val().length == 0 && check) {
                alert("Bạn chưa nhập homePhone")
                check = false;
            }
            if ($('#cellPhone').val().length == 0 && check) {
                alert("Bạn chưa nhập cellPhone")
                check = false;
            }
            if ($('#chooseQ').val() == 0 && check) {
                alert("Bạn phải chọn question")
                check = false;
            }
            return check;
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lab8</title>
        <style>
            html {
                font-size: 10px;
                scroll-behavior: smooth;
            }
            html * {
                box-sizing: border-box;
            }
            body {
                font-size: 1.6rem;
            }
            .register_button {
                display: flex;
                justify-content: center;
            }
            .btn {
                margin: 0 0.5rem;
            }
            input:focus {
                outline: none !important;
                border: 1px solid red;
                box-shadow: 0 0 10px #719ece;
            }
        </style>
    </head>
    <body>
        <script>
            function reset() {
                const input = document.getElementsByTagName('input');
                //console.log(input);
                for (let i = 0; i < input.length; i++) {}

                const selInput = document.getElementsByTagName('select');
                for (let i = 0; i < selInput.length; i++) {
                    selInput[i].selectedIndex = 0;
                }

                let gioitinh = document.getElementsByName('gioitinh');
                gioitinh[0].checked = true;
            }
            function register() {
                const username = document.getElementById('username').value;
                const password1 = document.getElementById('password-lv1').value;
                const password2 = document.getElementById('password-lv2').value;
                const question = document.getElementById('question').value;
                const answer = document.getElementById('answer').value;
                const fullname = document.getElementById('fullname').value;
                const email = document.getElementById('email').value;

                const re_password1 =
                    document.getElementById('re-password-lv1').value;

                const re_password2 =
                    document.getElementById('re-password-lv2').value;
                if (
                    username == '' ||
                    password1 == '' ||
                    re_password1 == '' ||
                    password2 == '' ||
                    re_password2 == '' ||
                    question == '' ||
                    answer == '' ||
                    fullname == '' ||
                    email == ''
                ) {
                    alert('all the fields that have "*" must be inputted');
                    return false;
                }
                if (
                    username.length < 6 ||
                    username.length > 12 ||
                    password1.length < 6 ||
                    password1.length > 12 ||
                    password2.length < 6 ||
                    password2.length > 12
                ) {
                    alert(
                        'The length of userName and all password from 6 to 12 characters.'
                    );
                    return false;
                }
                if (password1 != re_password1) {
                    alert('wrong password lv1');
                    return false;
                }
                if (password2 != re_password2) {
                    alert('wrong password lv2');
                    return false;
                }
                let test = '^[a-z]+@[a-z]+(\.[a-z]+)+$';
                let regex = new RegExp(test);
                if (!regex.test(email)) {
                    alert(
                        'Email must in correct format: userName@domainName (Example : aptech@sun.com.uk)'
                    );
                    return false;
                }
            }
        </script>
        <form method="POST" onsubmit="return register()">
            <fieldset>
                <legend>Information for play game</legend>
                <table align="center">
                    <tr>
                        <td class="field1" align="right">
                            <label>User name *</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="username" />
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Password level 1 *</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="password-lv1"
                                id="password-lv1"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Re-enter Password Level 1 *</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="re-password-lv1"
                                id="re-password-lv1"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Password level 2 *</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="password-lv2"
                                id="password-lv2"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Re-enter Password Level 2 *</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="re-password-lv2"
                                id="re-password-lv2"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Security Question</label>
                        </td>
                        <td>
                            <select name="security-question" id="question">
                                <option value="">Choose a question...</option>
                                <option value="1">
                                    What is your library card number
                                </option>
                                <option value="2">
                                    What was your first phone number
                                </option>
                                <option value="3">
                                    what was your first teacher name
                                </option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td class="field1" align="right">
                            <label>Answer</label>
                        </td>
                        <td>
                            <input type="text" name="answer" id="answer" />
                        </td>
                    </tr>
                </table>
            </fieldset>
            <fieldset>
                <legend>Customer information</legend>
                <table align="center">
                    <tr>
                        <td class="field2">
                            <label>Full name *</label>
                        </td>
                        <td>
                            <input type="text" name="fullname" id="fullname" />
                            <input
                                type="radio"
                                name="gioitinh"
                                id="Male"
                                value="Male"
                            />
                            Male
                            <input
                                type="radio"
                                name="gioitinh"
                                id="Female"
                                value="Female"
                            />
                            Female
                        </td>
                    </tr>
                    <tr>
                        <td class="field2">
                            <label>Email *</label>
                        </td>
                        <td>
                            <input type="text" name="email" id="email" />
                        </td>
                    </tr>
                    <tr>
                        <td class="field2">
                            <label>Birthday</label>
                        </td>
                        <td>
                            <select name="day" id="day">
                                <script>
                                    const d = new Date();

                                    for (let i = 1; i <= d.getDate(); ++i)
                                        document.write(
                                            '<option>' + i + '</option>'
                                        );
                                </script>
                            </select>
                            <select name="month" id="month">
                                <script>
                                    for (let i = 1; i <= d.getMonth(); ++i)
                                        document.write(
                                            '<option>' + i + '</option>'
                                        );
                                </script>
                            </select>
                            <select name="year" id="year">
                                <script>
                                    for (let i = 1940; i <= 2000; ++i)
                                        document.write(
                                            '<option>' + i + '</option>'
                                        );
                                </script>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td class="field2">
                            <label>Address</label>
                        </td>
                        <td>
                            <input type="text" name="address" id="address" />
                        </td>
                    </tr>
                    <tr>
                        <td class="field2">
                            <label>Home phone &nbsp &nbsp</label>
                        </td>
                        <td>
                            <input
                                type="text"
                                name="home_phone"
                                id="home_phone"
                            />
                        </td>
                    </tr>
                    <tr>
                        <td class="field2">
                            <label>Mobile</label>
                        </td>
                        <td>
                            <input type="text" name="mobile" id="mobile" />
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
        <p><b>Note:</b> all the fields that have "*" must be inputted</p>
        <div class="register_button">
            <button
                type="submit"
                id="Register"
                class="btn"
                onclick="return register()"
            >
                Register
            </button>
            <button type="button" id="Clear" class="btn" onclick="reset()">
                Clear
            </button>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thực hành số 8</title>
    <style>
        html{
            font-size: 10px;
            scroll-behavior: smooth;
        }
        html *{
            box-sizing: border-box;
        }
        body{
            font-size: 1.6rem;
        }

        .col-6{
            width: 50%;
            text-align: right;
            padding-right: 1rem;
        }
        .col-4{
            width: 33%;
            text-align: right;
            padding-right: 1rem;
        }
        /* */

        .register{
            padding: 2rem 1rem;
            width: 130rem;
            margin: auto;
        }
        .register__title{

        }

        .register__form{
            
        }
        .register__form fieldset{
            border-radius: 0.5rem;
        }
        .register__form legend{
            font-size: 1.8rem;
            font-weight: bold;
            color: blue;
        }
        .table{
            width: 100%;
        }
        .table tbody{
            width: 100%;
        }
        .table-borderless{
            border: none;
        }

        .register__button{
            display: flex;
            justify-content: center;
        }
        .btn{
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>
    
    <div class="register">
        <div class="register__title">

        </div>
        <div class="register__form">
            <form class="register__form--form" id="rs_form" onsubmit="return false;">
                <fieldset>
                    <legend>Infomation for play game</legend>
                    <table class="table table-borderless">
                        <tbody>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_UserName">User name *:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" required name="txt_UserName" id="txt_UserName">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_Password1">Password level 1 *:</label>
                                </td>
                                <td>
                                    <input type="password" class="form-control" required name="txt_Password1" id="txt_Password1">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_RePassword1">Re-enter password level 1 *:</label>
                                </td>
                                <td>
                                    <input type="password" class="form-control" required name="txt_RePassword1" id="txt_RePassword1">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_Password2">Password level 2 *:</label>
                                </td>
                                <td>
                                    <input type="password" class="form-control" required name="txt_Password2" id="txt_Password2">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_RePassword2">Re-enter password level 2 *:</label>
                                </td>
                                <td>
                                    <input type="password" class="form-control" required name="txt_RePassword2" id="txt_RePassword2">
                                </td>
                            </tr>
                            
                            <tr>
                                <td class="col-4">
                                    <label for="sel_Question">Security Question *:</label>
                                </td>
                                <td>
                                    <select name="sel_Question" required id="sel_Question">
                                        <option value=''>Choose a question ...</option>
                                        <option value='1'>What is your library card number</option>
                                        <option value='2'>What was your first phone number</option>
                                        <option value='3'>What was your first teacher name</option>
                                        <!---->
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td class="col-4">
                                    <label for="txt_Answer">Answer *:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" required name="txt_Answer" id="txt_Answer">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </fieldset>
                <fieldset>
                    <legend>Customer infomation</legend>
                    <table class="table table-borderless">
                        <tbody>
                            <tr>
                                <td class="col-6">
                                    <label for="txt_FullName">Full name *:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" required name="txt_FullName" id="txt_FullName">
                                    <input type="radio" name="rd_Sex" value="0" checked> Male
                                    <input type="radio" name="rd_Sex" value="1">Female
                                </td>
                            </tr>
                            <tr>
                                <td class="col-6">
                                    <label for="txt_Email">Email *:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" required name="txt_Email" id="txt_Email">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-6">
                                    <label for="txt_BirthDay">Birthday:</label>
                                </td>
                                <td>
                                    <input type="date" clas="form-control" name="txt_BirthDay" id="txt_BirthDay" min="01-01-1940" max="31-12-2000">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-6">
                                    <label for="txt_Address">Address:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" name="txt_Address" id="txt_Address">
                                </td>
                            </tr>
                            <tr>
                                <td class="col-6">
                                    <label for="txt_HomePhone">Home phone:</label>
                                </td>
                                <td>
                                    <input type="text" class="form-control" name="txt_HomePhone" id="txt_HomePhone">
                                    <label for="txt_MobilePhone">Mobile:</label>
                                    <input type="text" class="form-control" name="txt_MobilePhone" id="txt_MobilePhone">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </fieldset>
            </form>
        </div>
        <div class="register__footer">
            <p><strong>*Note:</strong> all of the fields that have "*" must be inputted</p>
            <div class="register__button">
                <button type="button" class="btn" onclick="Register(this)">
                    Register
                </button>
                <button type="button" class="btn" onclick="ClearData(this)">
                    Clear
                </button>
            </div>
        </div>
    </div>

    <script>
        function ClearData(ele){
            let input = document.getElementsByTagName("input");
            //console.log(input);
            for(let i=0;i<input.length;i++){
                input[i].value = "";
            }

            let selInput = document.getElementsByTagName("select");
            for(let i=0;i<selInput.length;i++){
                selInput[i].value = 0;
            }

            let rd_Sex = document.getElementsByName("rd_Sex");
            rd_Sex[0].checked = true;
        }

        function Register(ele){
            let isPass = true;
            let input = document.querySelectorAll("[required]");
            for(let i=0;i<input.length;i++){
                if(input[i].value == ""){
                    let value = input[i].labels[0].textContent;
                    let displayValue = value.substring(0, value.length - 3);
                    alert("Your " + displayValue + " must be inputted");
                    isPass = false;
                    break;
                }
            }

            if(isPass){
                let userName = document.getElementById("txt_UserName").value;
                let password1 = document.getElementById("txt_Password1").value;
                let rePassword1 = document.getElementById("txt_RePassword1").value;
                let password2 = document.getElementById("txt_Password2").value;
                let rePassword2 = document.getElementById("txt_RePassword2").value;


                if((userName.length < 6 || userName.length > 12) || (password1.length < 6 || password1.length > 12) || (password2.length < 6 || password2.length > 12)){
                    isPass = false;
                    alert("The length of userName and all password from 6 to 12 characters.");
                }

                if(isPass && (password1 != rePassword1)){
                    isPass = false;
                    alert("Password level 1 and re-enter password level 1 is the same.");
                }

                if(isPass && (password2 != rePassword2)){
                    isPass = false;
                    alert("Password level 2 and re-enter password level 2 is the same.");
                }

                if(isPass && (password1 == password2)){
                    isPass = false;
                    alert("Password level 1 and  password level 2 must be differented.");
                }

                if(isPass){
                    let email = document.getElementById("txt_Email");
                    let test = '^[a-z]+@[a-z]+(\.[a-z]+)+$';
                    let regex = new RegExp(test);
                    if(!regex.test(email)){
                        isPass = false;
                        alert("Email must in correct format: userName@domainName (Example : aptech@sun.com.uk");
                    }
                }
            }
        }

    </script>
</body>
</html>

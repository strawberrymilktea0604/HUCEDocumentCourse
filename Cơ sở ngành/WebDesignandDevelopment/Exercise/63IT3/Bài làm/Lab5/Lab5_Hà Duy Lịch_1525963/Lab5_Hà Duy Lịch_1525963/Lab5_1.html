<html>
    <head>
        <meta http-equiv= "content-type" content="charset=utf8">
        <title>Bài tập CSS</title>
        <style type="text/css">

        h1 {text-align: center;color: red;font-size: 30; font:bold}
        p {color:thistle;font-size:20 ;}
            .anh{
                position:absolute;
                z-index: -1;
                top:42px;
                left:42px;
            }
            
           
        </style>

    </head>
    <body>
        <h1>Welcome to Magic Land</h1><br>
        <div class =anh><img src="./God_Smile.bmp"></div>
        <p> So you can position an elements in terms of x and y coordinates.<br><br>
        But there is a third dimension.<br><br>
        You can also overlap elements using the z plane</p>
    </body>
</html>

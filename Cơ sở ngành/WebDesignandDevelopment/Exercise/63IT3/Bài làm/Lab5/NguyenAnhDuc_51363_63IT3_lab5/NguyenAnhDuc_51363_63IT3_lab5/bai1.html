<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        h1.title {
            color: red;
            text-align: center;
        }
        p.document{
            position: absolute;
            z-index: 2;
            color: pink;
            
        }
        
        img {
    position: absolute;
    width: 300px;
    height: auto;
    z-index: 1;
    padding-left: 100px;
            }
        
    </style>
</head>
<body>
<div>
    <h1 class="title">Welcome to Magic Land</h1>
    <img src="God_Smile.png">
    <p class="document">
        So you can position an element in terms of x and y coordinates.<br>
        But there is a third dimention.<br>
        You can also overlap element using the z plane.
    </p>
</div>
</body>
</html>

<html>
    <head>
        <title>bai1lab5</title>
        <style>
            h1{
                color:red;
                text-align: center;
                font-size:30px;
            }
            .p{
                color:palevioletred;
                line-height: 1.8;
            }
            #anh{
                position: absolute;
                top:40px;
                left:40px;
                z-index:-1;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to Magic Land</h1>
        <div id=anh><img src="God_Smile.bmp" width=100px height=100px></div>
        <div class=p>So you can position an element in terms of x and y coordinates.<br>
        But there is a third dismension.<br>
        You can also overlap element using the z plane.</div>
    </body>
</html>

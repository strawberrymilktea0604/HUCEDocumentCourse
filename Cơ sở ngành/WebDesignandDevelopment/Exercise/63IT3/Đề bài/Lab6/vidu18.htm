<title>New Page 1</title>
<script>
 function doloop()
 {
 	var String1='<hr align="center" width=';
 	document.open();
 	for(var size=5;size<=100;size+=5)
 	  document.write(String1+size+'%>');
 	  document.close();
 }
</script>
</head>

<body>
<form>
<input type="button" value="Test the loop" onclick="doloop()">
</form>
</body>
